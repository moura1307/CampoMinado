name: Minesweeper

on:
  push:
    tags: ["v*"]        # pushing a tag like v1.0 builds everything and creates a Release
  workflow_dispatch:    # lets you run it by hand from the Actions tab too

env:
  # Folder that contains main.py and the assets/ folder.
  # Use "." if they sit at the top level of the repo,
  # otherwise put the folder name here (e.g. "MineSweeper").
  PROJECT_DIR: CampoMinado

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos-apple-silicon, os: macos-latest }
          - { name: macos-intel, os: macos-15-intel }
          - { name: linux, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # Fails early with a readable message if PROJECT_DIR is wrong
      - name: Check project files
        shell: bash
        run: |
          echo "Repo contents:"
          ls -la
          echo "Project folder (${PROJECT_DIR}):"
          ls -la "${PROJECT_DIR}"
          test -f "${PROJECT_DIR}/main.py" || { echo "::error::main.py not found in '${PROJECT_DIR}' - set PROJECT_DIR at the top of build.yml"; exit 1; }
          test -d "${PROJECT_DIR}/assets" || { echo "::error::assets/ folder not found in '${PROJECT_DIR}'"; exit 1; }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pygame pyinstaller

      # ---------- Windows: single .exe ----------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.PROJECT_DIR }}
        run: pyinstaller --onefile --windowed --name MineSweeper --add-data "assets;assets" main.py

      # ---------- macOS: .app, zipped so it keeps its permissions ----------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pyinstaller --windowed --name MineSweeper --add-data "assets:assets" main.py
          ditto -c -k --keepParent dist/MineSweeper.app dist/MineSweeper-${{ matrix.name }}.zip

      # ---------- Linux: .deb that installs the game ----------
      - name: Build (Linux .deb)
        if: runner.os == 'Linux'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pyinstaller --onefile --name minesweeper --add-data "assets:assets" main.py

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0"
          fi

          PKG="minesweeper_${VERSION}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" "$PKG/usr/share/pixmaps"
          cp dist/minesweeper "$PKG/usr/bin/minesweeper"
          cp assets/bomb.png "$PKG/usr/share/pixmaps/minesweeper.png"

          cat > "$PKG/usr/share/applications/minesweeper.desktop" <<EOF
          [Desktop Entry]
          Name=Mine Sweeper
          Exec=minesweeper
          Icon=minesweeper
          Type=Application
          Categories=Game;LogicGame;
          EOF

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: minesweeper
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Your Name <you@example.com>
          Description: Minesweeper made with pygame
          EOF

          dpkg-deb --build --root-owner-group "$PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.PROJECT_DIR }}/dist/MineSweeper.exe
            ${{ env.PROJECT_DIR }}/dist/*.zip
            ${{ env.PROJECT_DIR }}/*.deb
          if-no-files-found: error

  # Only runs when you push a tag: collects every build into a GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # find -type f: the artifacts can land in subfolders (e.g. dist/), and gh needs file paths
        run: gh release create "$GITHUB_REF_NAME" $(find artifacts -type f) --repo "$GITHUB_REPOSITORY" --generate-notes
